<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>数字集計</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f1e8;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  color:#333;
}

header{
  background:#5f8f68;
  color:white;
  text-align:center;
  padding:15px 10px;
}

header h1{
  margin:0;
  font-size:21px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:12px;
}

/* 4セット */
.sets{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.set{
  background:white;
  border-radius:10px;
  padding:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}

.set-title{
  text-align:center;
  font-weight:bold;
  margin-bottom:8px;
  font-size:16px;
}

/* 面 */
.face{
  margin-bottom:8px;
}

.face-title{
  font-weight:bold;
  font-size:14px;
  margin-bottom:5px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
}

.cell{
  width:100%;
  aspect-ratio:1/1;
  border:1px solid #ccc;
  border-radius:5px;
  text-align:center;
  font-size:17px;
  font-weight:bold;
  background:#fafafa;
}

.cell:focus{
  outline:none;
  border-color:#5f8f68;
  background:#eef7ef;
}

.face-total{
  text-align:right;
  font-size:11px;
  color:#666;
  margin-top:3px;
}

/* 集計 */
.summary{
  background:white;
  border-radius:10px;
  padding:12px;
  margin-top:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}

.summary h2{
  margin:0 0 8px;
  font-size:18px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:8px;
}

.stat{
  background:#f5f1e8;
  border-radius:6px;
  padding:7px;
  text-align:center;
}

.stat small{
  display:block;
  font-size:10px;
  color:#666;
}

.stat strong{
  font-size:18px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:8px;
}

th,td{
  border-bottom:1px solid #ddd;
  padding:5px;
  text-align:center;
  font-size:13px;
}

th{
  background:#f5f1e8;
}

.set-results{
  margin-top:10px;
}

.set-results div{
  display:flex;
  justify-content:space-between;
  padding:6px;
  border-bottom:1px solid #eee;
  font-size:13px;
}

.buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

button{
  flex:1;
  min-height:42px;
  border:0;
  border-radius:7px;
  font-size:14px;
  font-weight:bold;
}

.clear{
  background:#777;
  color:white;
}

.top{
  background:#5f8f68;
  color:white;
}

.note{
  text-align:center;
  color:#777;
  font-size:11px;
  margin:12px 0;
}

/* スマホでは1セットずつ表示 */
@media(max-width:600px){

  .sets{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .cell{
    font-size:16px;
  }

}

@media(max-width:400px){

  .sets{
    grid-template-columns:1fr;
  }

  .cell{
    font-size:19px;
  }

}
</style>
</head>

<body>

<header>
  <h1>🔢 数字集計</h1>
  <div>0〜5 または「-」を入力</div>
</header>

<div class="container">

<!-- ========================= -->
<!-- 4セット -->
<!-- ========================= -->

<div class="sets">

<!-- セット1 -->
<div class="set">
  <div class="set-title">①セット</div>

  <div class="face">
    <div class="face-title">上1面</div>
    <div class="grid" id="grid1"></div>
    <div class="face-total" id="faceTotal1">合計 0</div>
  </div>

  <div class="face">
    <div class="face-title">下1面</div>
    <div class="grid" id="grid2"></div>
    <div class="face-total" id="faceTotal2">合計 0</div>
  </div>
</div>


<!-- セット2 -->
<div class="set">
  <div class="set-title">②セット</div>

  <div class="face">
    <div class="face-title">上2面</div>
    <div class="grid" id="grid3"></div>
    <div class="face-total" id="faceTotal3">合計 0</div>
  </div>

  <div class="face">
    <div class="face-title">下2面</div>
    <div class="grid" id="grid4"></div>
    <div class="face-total" id="faceTotal4">合計 0</div>
  </div>
</div>


<!-- セット3 -->
<div class="set">
  <div class="set-title">③セット</div>

  <div class="face">
    <div class="face-title">上3面</div>
    <div class="grid" id="grid5"></div>
    <div class="face-total" id="faceTotal5">合計 0</div>
  </div>

  <div class="face">
    <div class="face-title">下3面</div>
    <div class="grid" id="grid6"></div>
    <div class="face-total" id="faceTotal6">合計 0</div>
  </div>
</div>


<!-- セット4 -->
<div class="set">
  <div class="set-title">④セット</div>

  <div class="face">
    <div class="face-title">上4面</div>
    <div class="grid" id="grid7"></div>
    <div class="face-total" id="faceTotal7">合計 0</div>
  </div>

  <div class="face">
    <div class="face-title">下4面</div>
    <div class="grid" id="grid8"></div>
    <div class="face-total" id="faceTotal8">合計 0</div>
  </div>
</div>

</div>


<!-- ========================= -->
<!-- 上4面 -->
<!-- ========================= -->

<div class="summary">

<h2>⬆️ 上4面の集計</h2>

<div class="stats">
  <div class="stat">
    <small>合計</small>
    <strong id="upperTotal">0</strong>
  </div>

  <div class="stat">
    <small>入力数</small>
    <strong id="upperCount">0</strong>
  </div>

  <div class="stat">
    <small>平均</small>
    <strong id="upperAverage">-</strong>
  </div>
</div>

<table>
<thead>
<tr>
<th>数字</th>
<th>個数</th>
<th>割合</th>
</tr>
</thead>
<tbody id="upperBreakdown"></tbody>
</table>

</div>


<!-- ========================= -->
<!-- 下4面 -->
<!-- ========================= -->

<div class="summary">

<h2>⬇️ 下4面の集計</h2>

<div class="stats">
  <div class="stat">
    <small>合計</small>
    <strong id="lowerTotal">0</strong>
  </div>

  <div class="stat">
    <small>入力数</small>
    <strong id="lowerCount">0</strong>
  </div>

  <div class="stat">
    <small>平均</small>
    <strong id="lowerAverage">-</strong>
  </div>
</div>

<table>
<thead>
<tr>
<th>数字</th>
<th>個数</th>
<th>割合</th>
</tr>
</thead>
<tbody id="lowerBreakdown"></tbody>
</table>

</div>


<!-- ========================= -->
<!-- 4セット -->
<!-- ========================= -->

<div class="summary">

<h2>📊 4セットの集計</h2>

<div class="set-results">

<div>
<span>①セット（上1＋下1）</span>
<strong id="setTotal1">0</strong>
</div>

<div>
<span>②セット（上2＋下2）</span>
<strong id="setTotal2">0</strong>
</div>

<div>
<span>③セット（上3＋下3）</span>
<strong id="setTotal3">0</strong>
</div>

<div>
<span>④セット（上4＋下4）</span>
<strong id="setTotal4">0</strong>
</div>

</div>

<div class="buttons">

<button class="clear" id="clearBtn">
🗑 全てクリア
</button>

<button class="top" id="topBtn">
↑ 上に戻る
</button>

</div>

</div>


<div class="note">
入力内容はこのスマートフォン内に保存されます。
</div>

</div>


<script>

const STORAGE_KEY = "simpleNumberApp";


/* =========================
   マスを作る
========================= */

function createGrids(){

  for(let face=1; face<=8; face++){

    const grid =
      document.getElementById("grid" + face);

    for(let i=0; i<12; i++){

      const input =
        document.createElement("input");

      input.type = "text";
      input.className = "cell";
      input.maxLength = 1;
      input.inputMode = "numeric";
      input.autocomplete = "off";

      input.addEventListener("input",function(){

        let value = this.value.trim();

        /* 全角数字を半角へ */
        value = value.replace(/[０-５]/g,function(s){
          return String.fromCharCode(
            s.charCodeAt(0)-0xFEE0
          );
        });

        if(value === "−"){
          value = "-";
        }

        /* 0〜5と-以外を削除 */
        if(
          value !== "" &&
          value !== "-" &&
          !/^[0-5]$/.test(value)
        ){
          value = "";
        }

        this.value = value;

        saveData();
        calculate();

      });

      /* Enterで次のマスへ */
      input.addEventListener("keydown",function(e){

        if(e.key === "Enter"){

          e.preventDefault();

          const all =
            Array.from(
              document.querySelectorAll(".cell")
            );

          const index = all.indexOf(this);

          if(all[index+1]){
            all[index+1].focus();
          }

        }

      });

      grid.appendChild(input);
    }
  }
}


/* =========================
   保存
========================= */

function saveData(){

  const data =
    Array.from(
      document.querySelectorAll(".cell")
    ).map(cell => cell.value);

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}


/* =========================
   読み込み
========================= */

function loadData(){

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if(!saved) return;

  try{

    const data =
      JSON.parse(saved);

    document
      .querySelectorAll(".cell")
      .forEach((cell,index)=>{
        cell.value = data[index] || "";
      });

  }catch(e){

    console.log("読み込みエラー");

  }
}


/* =========================
   集計
========================= */

function getStats(startFace,endFace){

  let total = 0;
  let count = 0;

  const numbers =
    [0,0,0,0,0,0];

  const cells =
    document.querySelectorAll(".cell");

  for(
    let face=startFace;
    face<=endFace;
    face++
  ){

    const start =
      (face-1)*12;

    const end =
      start+12;

    for(let i=start;i<end;i++){

      const value =
        cells[i].value;

      if(/^[0-5]$/.test(value)){

        const n = Number(value);

        total += n;
        count++;

        numbers[n]++;
      }
    }
  }

  return {
    total,
    count,
    numbers
  };
}


/* =========================
   集計表示
========================= */

function showStats(
  stats,
  totalId,
  countId,
  averageId,
  breakdownId
){

  document.getElementById(totalId)
    .textContent = stats.total;

  document.getElementById(countId)
    .textContent = stats.count;

  document.getElementById(averageId)
    .textContent =
      stats.count > 0
      ? (stats.total / stats.count).toFixed(2)
      : "-";

  const tbody =
    document.getElementById(breakdownId);

  tbody.innerHTML = "";

  for(let n=0;n<=5;n++){

    const percentage =
      stats.count > 0
      ? stats.numbers[n] / stats.count * 100
      : 0;

    const row =
      document.createElement("tr");

    row.innerHTML =
      "<td><strong>"+n+"</strong></td>" +
      "<td>"+stats.numbers[n]+"</td>" +
      "<td>"+percentage.toFixed(1)+"%</td>";

    tbody.appendChild(row);
  }
}


/* =========================
   全体計算
========================= */

function calculate(){

  const cells =
    document.querySelectorAll(".cell");


  /* 各面の合計 */

  const faceTotals =
    [0,0,0,0,0,0,0,0];


  cells.forEach((cell,index)=>{

    if(/^[0-5]$/.test(cell.value)){

      const face =
        Math.floor(index/12);

      faceTotals[face] +=
        Number(cell.value);

    }

  });


  /* 各面表示 */

  for(let i=0;i<8;i++){

    document.getElementById(
      "faceTotal"+(i+1)
    ).textContent =
      "合計 "+faceTotals[i];

  }


  /* 上4面 */

  const upper =
    getStats(1,1);

  const upper2 =
    getStats(3,3);

  const upper3 =
    getStats(5,5);

  const upper4 =
    getStats(7,7);


  const upperStats = combineStats([
    upper,
    upper2,
    upper3,
    upper4
  ]);

  showStats(
    upperStats,
    "upperTotal",
    "upperCount",
    "upperAverage",
    "upperBreakdown"
  );


  /* 下4面 */

  const lower =
    combineStats([
      getStats(2,2),
      getStats(4,4),
      getStats(6,6),
      getStats(8,8)
    ]);

  showStats(
    lower,
    "lowerTotal",
    "lowerCount",
    "lowerAverage",
    "lowerBreakdown"
  );


  /* 4セット */

  document.getElementById("setTotal1")
    .textContent =
      faceTotals[0]+faceTotals[1];

  document.getElementById("setTotal2")
    .textContent =
      faceTotals[2]+faceTotals[3];

  document.getElementById("setTotal3")
    .textContent =
      faceTotals[4]+faceTotals[5];

  document.getElementById("setTotal4")
    .textContent =
      faceTotals[6]+faceTotals[7];

}


/* =========================
   集計を合算
========================= */

function combineStats(list){

  const result = {
    total:0,
    count:0,
    numbers:[0,0,0,0,0,0]
  };

  list.forEach(stats=>{

    result.total += stats.total;
    result.count += stats.count;

    for(let i=0;i<=5;i++){
      result.numbers[i] +=
        stats.numbers[i];
    }

  });

  return result;
}


/* =========================
   全てクリア
========================= */

document.getElementById("clearBtn")
.addEventListener("click",function(){

  if(!confirm("96マスを全て消しますか？")){
    return;
  }

  document
    .querySelectorAll(".cell")
    .forEach(cell=>{
      cell.value="";
    });

  localStorage.removeItem(STORAGE_KEY);

  calculate();

});


/* =========================
   上へ戻る
========================= */

document.getElementById("topBtn")
.addEventListener("click",function(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

});


/* =========================
   起動
========================= */

createGrids();

loadData();

calculate();

</script>

</body>
</html>
